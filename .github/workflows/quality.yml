name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=Drive10_payflow
            -Dsonar.organization=drive10
            -Dsonar.sources=src,common
            -Dsonar.tests=src
            -Dsonar.java.binaries=src/*/target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  frontend-scan:
    name: Frontend Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/payment-page/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/payment-page

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend/payment-page

      - name: Run Tests
        run: npm test -- --run --coverage
        working-directory: frontend/payment-page

      - name: SonarCloud Frontend Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend/payment-page
          args: >
            -Dsonar.projectKey=payflow_frontend
            -Dsonar.organization=drive10
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.testExecutionReportPaths=coverage/vitest-report.xml
