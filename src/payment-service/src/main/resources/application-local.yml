spring:
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: payment_schema
  datasource:
    url: jdbc:postgresql://localhost:5432/payflow
    username: payflow
    password: payflow_dev_pass_123
  data:
    redis:
      host: localhost
      port: 6379
      password: redis_dev_pass_123
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        metadata.max.age.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

app:
  auth-service:
    url: http://localhost:8082
  simulator:
    url: http://localhost:8086
  notification:
    url: http://localhost:8085
  webhook:
    secret: webhook_secret_dev_789
  internal-auth:
    secret: internal_service_secret_for_payflow_dev_environment_123456789
  merchant:
    api-keys: merchant_key_test_001,merchant_key_test_002

server:
  port: 8083