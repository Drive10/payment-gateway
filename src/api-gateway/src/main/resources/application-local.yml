server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: http://localhost:5173
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      routes:
        - id: auth-service
          uri: http://localhost:8082
          predicates:
            - Path=/auth/**
        - id: auth-service-v1
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/auth/**
        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/payments/**
        - id: payment-service-v1
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/payments/**
        - id: swagger-ui
          uri: http://localhost:8083
          predicates:
            - Path=/swagger-ui/**,/v3/api-docs/**
  data:
    redis:
      host: localhost
      port: 6379
      password: redis_dev_pass_123

app:
  jwt:
    secret: dGhpcyBpcyBhIGp3dCBzZWNyZXQga2V5IGZvciBwYXlmbG93IGRldiBlbnZpcm9ubWVudA==
  internal-auth:
    secret: internal_service_secret_for_payflow_dev_environment_123456789