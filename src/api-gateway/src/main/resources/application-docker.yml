spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
      routes:
        - id: auth-service
          uri: http://auth-service:8082
          predicates:
            - Path=/auth/**
        - id: auth-service-v1
          uri: http://auth-service:8082
          predicates:
            - Path=/api/v1/auth/**
        - id: payment-service
          uri: http://payment-service:8083
          predicates:
            - Path=/api/payments/**
        - id: payment-service-v1
          uri: http://payment-service:8083
          predicates:
            - Path=/api/v1/payments/**
        - id: admin-service
          uri: http://payment-service:8083
          predicates:
            - Path=/admin/**
        - id: swagger-ui
          uri: http://payment-service:8083
          predicates:
            - Path=/swagger-ui/**,/v3/api-docs/**
  data:
    redis:
      host: redis
      password: redis_dev_pass_123
app:
  jwt:
    secret: jwt_secret_key_payflow_dev_2024_min_length_32_chars
  internal-auth:
    secret: internal_auth_secret_payflow_dev_2024
